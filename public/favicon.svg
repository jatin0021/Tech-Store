<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Neon Orange-to-Yellow gradient -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" /> <!-- orange-600 -->
      <stop offset="50%" stop-color="#f97316" /> <!-- orange-500 -->
      <stop offset="100%" stop-color="#facc15" /> <!-- yellow-400 -->
    </linearGradient>

    <!-- Metallic dark gradient for the chip body -->
    <linearGradient id="chipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" /> <!-- gray-900 -->
      <stop offset="100%" stop-color="#030712" /> <!-- gray-950 -->
    </linearGradient>

    <!-- Glow Filter for glowing elements -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient glow in background -->
  <circle cx="256" cy="256" r="230" fill="url(#glow)" />

  <!-- Outer Ring (Broken tech circle/orbit) representing technology/hardware -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonOrange)" stroke-width="8" stroke-dasharray="30 20" opacity="0.3" />
  
  <!-- Outer glowing ring segments -->
  <path d="M 256,46 A 210,210 0 0,1 466,256" fill="none" stroke="url(#neonOrange)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 256,466 A 210,210 0 0,1 46,256" fill="none" stroke="url(#neonOrange)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Chip Pins / Circuit lines extending from the center -->
  <g stroke="url(#neonOrange)" stroke-width="10" stroke-linecap="round">
    <!-- Top Pins -->
    <line x1="200" y1="130" x2="200" y2="70" />
    <line x1="256" y1="130" x2="256" y2="50" />
    <line x1="312" y1="130" x2="312" y2="70" />
    
    <!-- Bottom Pins -->
    <line x1="200" y1="382" x2="200" y2="442" />
    <line x1="256" y1="382" x2="256" y2="462" />
    <line x1="312" y1="382" x2="312" y2="442" />

    <!-- Left Pins -->
    <line x1="130" y1="200" x2="70" y2="200" />
    <line x1="130" y1="256" x2="50" y2="256" />
    <line x1="130" y1="296" x2="70" y2="296" />

    <!-- Right Pins -->
    <line x1="382" y1="200" x2="442" y2="200" />
    <line x1="382" y1="256" x2="462" y2="256" />
    <line x1="382" y1="296" x2="442" y2="296" />
  </g>

  <!-- Pin terminal dots -->
  <g fill="url(#neonOrange)">
    <circle cx="200" cy="70" r="10" />
    <circle cx="256" cy="50" r="10" />
    <circle cx="312" cy="70" r="10" />
    
    <circle cx="200" cy="442" r="10" />
    <circle cx="256" cy="462" r="10" />
    <circle cx="312" cy="442" r="10" />

    <circle cx="70" cy="200" r="10" />
    <circle cx="50" cy="256" r="10" />
    <circle cx="70" cy="296" r="10" />

    <circle cx="442" cy="200" r="10" />
    <circle cx="462" cy="256" r="10" />
    <circle cx="442" cy="296" r="10" />
  </g>

  <!-- Central Microchip Body -->
  <rect x="130" y="130" width="252" height="252" rx="48" fill="url(#chipBody)" stroke="url(#neonOrange)" stroke-width="12" filter="url(#neonGlow)" />
  
  <!-- Internal circuit border -->
  <rect x="160" y="160" width="192" height="192" rx="32" fill="none" stroke="url(#neonOrange)" stroke-width="4" opacity="0.4" />

  <!-- Glowing Stylized 'T' shape with tech circuit details -->
  <g filter="url(#neonGlow)">
    <!-- Horizontal Bar of 'T' -->
    <path d="M 190,210 C 190,210 256,210 322,210" stroke="url(#neonOrange)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Vertical Bar of 'T' -->
    <path d="M 256,210 L 256,306" stroke="url(#neonOrange)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Diagonal circuit track extending from the bottom of T -->
    <path d="M 256,306 L 290,340" fill="none" stroke="url(#neonOrange)" stroke-width="16" stroke-linecap="round" />
    <circle cx="290" cy="340" r="12" fill="url(#neonOrange)" />
  </g>
</svg>